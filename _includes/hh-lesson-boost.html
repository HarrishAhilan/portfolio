<style>
/* Consistent readable font across every CSA lesson page, matching the rest of the portfolio */
.post-content {
  font-family: 'Calibri', 'Lato', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
}

/* A little more breathing room than the default 800px column, still readable */
.wrapper {
  max-width: 1080px !important;
}

/* Collapsed table of contents, built client-side from the auto-generated TOC */
.hh-toc-details {
  margin: 0 0 1.5rem 0;
  border: 1px solid #d7dbe0;
  border-radius: 8px;
  padding: 0.6rem 1rem;
  background: rgba(34,211,238,0.04);
}

.hh-toc-details summary {
  cursor: pointer;
  font-weight: 700;
  font-family: 'Calibri', 'Lato', sans-serif;
}

.hh-toc-details ul {
  margin-top: 0.75rem;
}

/* Floating gamification widget */
.hh-gamify {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 9999;
  width: 240px;
  font-family: 'Calibri', 'Lato', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0d1117;
  color: #e9edf5;
  border: 1px solid #2a3350;
  border-radius: 12px;
  padding: 14px 16px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.4);
  transition: transform 0.2s ease;
}

.hh-gamify.hh-collapsed .hh-gamify-body {
  display: none;
}

.hh-gamify-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  font-weight: 700;
  font-size: 0.9rem;
}

.hh-gamify-level {
  color: #22d3ee;
}

.hh-gamify-body {
  margin-top: 10px;
}

.hh-gamify-bar-track {
  background: #1b2136;
  border-radius: 6px;
  height: 8px;
  overflow: hidden;
  margin: 6px 0 10px 0;
}

.hh-gamify-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #22d3ee, #a78bfa);
  transition: width 0.3s ease;
}

.hh-gamify-stat {
  font-size: 0.8rem;
  color: #9aa5bd;
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}

.hh-gamify-nudge {
  font-size: 0.78rem;
  color: #f0c419;
  margin: 8px 0;
  line-height: 1.4;
}

.hh-gamify-btn {
  width: 100%;
  margin-top: 6px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid #2a3350;
  background: #161c2c;
  color: #e9edf5;
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
}

.hh-gamify-btn:hover {
  border-color: #22d3ee;
  box-shadow: 0 0 12px rgba(34,211,238,0.3);
}

.hh-gamify-btn.hh-done {
  background: rgba(63,185,80,0.15);
  border-color: rgba(63,185,80,0.4);
  color: #3fb950;
}

.hh-burst {
  position: fixed;
  pointer-events: none;
  font-size: 1.4rem;
  z-index: 10000;
  animation: hh-float-up 0.9s ease-out forwards;
}

@keyframes hh-float-up {
  0% { transform: translateY(0) scale(0.6); opacity: 1; }
  100% { transform: translateY(-60px) scale(1.3); opacity: 0; }
}

@media (max-width: 700px) {
  .hh-gamify { width: 180px; right: 10px; bottom: 10px; padding: 10px 12px; }
}
</style>

<div class="hh-gamify" id="hhGamify">
  <div class="hh-gamify-head" id="hhGamifyHead">
    <span><span class="hh-gamify-level" id="hhLevel">Lv 1</span> &middot; CSA Tracker</span>
    <span id="hhCaret">&#9662;</span>
  </div>
  <div class="hh-gamify-body" id="hhGamifyBody">
    <div class="hh-gamify-stat"><span>XP</span><span id="hhXpText">0 / 0</span></div>
    <div class="hh-gamify-bar-track"><div class="hh-gamify-bar-fill" id="hhXpBar" style="width:0%;"></div></div>
    <div class="hh-gamify-stat"><span>Lessons done</span><span id="hhCountText">0 / 0</span></div>
    <div class="hh-gamify-nudge" id="hhNudge"></div>
    <button class="hh-gamify-btn" id="hhMarkBtn" type="button">Mark this lesson complete</button>
  </div>
</div>

<script>
(function () {
  var LESSONS = [
    { u: 1, url: "/portfolio/csa/unit_01/1_1" }, { u: 1, url: "/portfolio/csa/unit_01/1_2" },
    { u: 1, url: "/portfolio/csa/unit_01/1_3" }, { u: 1, url: "/portfolio/csa/unit_01/1_4" },
    { u: 1, url: "/portfolio/csa/unit_01/1_5" }, { u: 1, url: "/portfolio/csa/unit_01/1_6" },
    { u: 1, url: "/portfolio/csa/unit_01/1_7" }, { u: 1, url: "/portfolio/csa/unit_01/1_8" },
    { u: 1, url: "/portfolio/csa/unit_01/1_9" }, { u: 1, url: "/portfolio/csa/unit_01/1_10" },
    { u: 1, url: "/portfolio/csa/unit_01/1_11" }, { u: 1, url: "/portfolio/csa/unit_01/1_12" },
    { u: 1, url: "/portfolio/csa/unit_01/1_13" }, { u: 1, url: "/portfolio/csa/unit_01/1_14" },
    { u: 1, url: "/portfolio/csa/unit_01/1_15" },
    { u: 2, url: "/portfolio/csa/unit_02/2_3" }, { u: 2, url: "/portfolio/csa/unit_02/2_4" },
    { u: 2, url: "/portfolio/csa/unit_02/2_7" }, { u: 2, url: "/portfolio/csa/unit_02/2_8" },
    { u: 2, url: "/portfolio/csa/unit_02/2_10" }, { u: 2, url: "/portfolio/csa/unit_02/2_11" },
    { u: 2, url: "/portfolio/csa/unit_02/2_12" },
    { u: 3, url: "/portfolio/csa/unit_03/3_3" }, { u: 3, url: "/portfolio/csa/unit_03/3_5" },
    { u: 3, url: "/portfolio/csa/unit_03/3_9" },
    { u: 4, url: "/portfolio/csa/unit_04/4_3" }, { u: 4, url: "/portfolio/csa/unit_04/4_4" },
    { u: 4, url: "/portfolio/csa/unit_04/4_8" }, { u: 4, url: "/portfolio/csa/unit_04/4_9" },
    { u: 4, url: "/portfolio/csa/unit_04/4_11" }, { u: 4, url: "/portfolio/csa/unit_04/4_12" }
  ];
  var STORE_KEY = "hh_csa_progress_v1";
  var XP_PER_LESSON = 10;

  function loadProgress() {
    var raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) {}
    if (raw) {
      try { return JSON.parse(raw); } catch (e) {}
    }
    // First run: seed with what's actually true in GitHub Issue #1 (Units 1-3 done, Unit 4 not started)
    var seed = {};
    LESSONS.forEach(function (l) { seed[l.url] = l.u <= 3; });
    saveProgress(seed);
    return seed;
  }

  function saveProgress(p) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch (e) {}
  }

  function currentUrl() {
    var path = window.location.pathname.replace(/\/$/, "");
    return path;
  }

  function render() {
    var progress = loadProgress();
    var doneCount = 0;
    LESSONS.forEach(function (l) { if (progress[l.url]) doneCount++; });
    var total = LESSONS.length;
    var xp = doneCount * XP_PER_LESSON;
    var level = Math.floor(xp / 50) + 1;
    var xpIntoLevel = xp % 50;

    document.getElementById("hhLevel").textContent = "Lv " + level;
    document.getElementById("hhXpText").textContent = xpIntoLevel + " / 50";
    document.getElementById("hhXpBar").style.width = ((xpIntoLevel / 50) * 100) + "%";
    document.getElementById("hhCountText").textContent = doneCount + " / " + total;

    var here = currentUrl();
    var match = LESSONS.filter(function (l) { return here.indexOf(l.url) === 0; })[0];
    var btn = document.getElementById("hhMarkBtn");
    var nudge = document.getElementById("hhNudge");

    if (match) {
      var isDone = !!progress[match.url];
      btn.style.display = "block";
      btn.textContent = isDone ? "Completed ✓" : "Mark this lesson complete";
      btn.className = "hh-gamify-btn" + (isDone ? " hh-done" : "");
      btn.onclick = function (evt) {
        progress[match.url] = !progress[match.url];
        saveProgress(progress);
        if (progress[match.url]) burst(evt);
        render();
      };
      nudge.textContent = isDone
        ? "Already logged as done in your tracker."
        : (match.u === 4 ? "This is Unit 4 — your next target after finishing 1-3." : "Not marked done yet.");
    } else {
      btn.style.display = "none";
      var remainingUnit4 = LESSONS.filter(function (l) { return l.u === 4 && !progress[l.url]; }).length;
      nudge.textContent = remainingUnit4 > 0
        ? remainingUnit4 + " Unit 4 lessons left to start."
        : "All tracked lessons complete.";
    }
  }

  function burst(evt) {
    var emojis = ["✨", "🔥", "⭐", "🚀"];
    var e = document.createElement("div");
    e.className = "hh-burst";
    e.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    var rect = document.getElementById("hhMarkBtn").getBoundingClientRect();
    e.style.left = (rect.left + rect.width / 2 - 10) + "px";
    e.style.top = (rect.top - 6) + "px";
    document.body.appendChild(e);
    setTimeout(function () { e.remove(); }, 900);
  }

  document.addEventListener("DOMContentLoaded", function () {
    render();

    var head = document.getElementById("hhGamifyHead");
    var widget = document.getElementById("hhGamify");
    var caret = document.getElementById("hhCaret");
    head.addEventListener("click", function () {
      widget.classList.toggle("hh-collapsed");
      caret.innerHTML = widget.classList.contains("hh-collapsed") ? "&#9656;" : "&#9662;";
    });

    // Collapse the long auto-generated table of contents into a toggle
    var content = document.querySelector(".post-content");
    if (content) {
      var firstList = content.querySelector(":scope > ul");
      if (firstList) {
        var details = document.createElement("details");
        details.className = "hh-toc-details";
        var summary = document.createElement("summary");
        summary.textContent = "Contents";
        details.appendChild(summary);
        firstList.parentNode.insertBefore(details, firstList);
        details.appendChild(firstList);
      }
    }
  });
})();
</script>
